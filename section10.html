<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astro Academy v10.1 | Advanced Dignity</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #ffd700; --bg: #050811; --card: #111827; --text: #e5e7eb; --accent: #00ffcc; }
        body { background: var(--bg); color: #e5e7eb; font-family: 'Poppins', sans-serif; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 500px; }
        
        .card { background: var(--card); border-radius: 24px; padding: 25px; border: 1px solid rgba(255,215,0,0.15); box-shadow: 0 15px 40px rgba(0,0,0,0.6); }
        h2 { color: var(--gold); font-size: 22px; margin-bottom: 5px; }
        
        select { width: 100%; padding: 16px; border-radius: 14px; background: #1f2937; color: white; border: 1px solid #374151; margin: 10px 0; }
        button { width: 100%; padding: 16px; border-radius: 14px; border: none; background: var(--gold); font-weight: 700; cursor: pointer; text-transform: uppercase; }

        .result-box { margin-top: 25px; display: none; }
        .dignity-tag { display: inline-block; padding: 5px 12px; border-radius: 8px; font-size: 11px; font-weight: 700; margin-bottom: 10px; }
        .uchcha { background: rgba(255, 215, 0, 0.2); color: var(--gold); border: 1px solid var(--gold); }
        .neecha { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
        
        .insight-box { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 15px; border-left: 4px solid var(--accent); }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>🔥 Advanced Dignity Analysis</h2>
        <p style="font-size: 12px; color: #9ca3af;">Uchcha, Neecha aur Neecha-Bhanga (Cancellation) Logic.</p>
        
        <select id="digSelect">
            <option value="sun">Sun: Aries (Uchcha) / Libra (Neecha)</option>
            <option value="moon">Moon: Taurus (Uchcha) / Scorpio (Neecha)</option>
            <option value="mars">Mars: Capricorn (Uchcha) / Cancer (Neecha)</option>
            <option value="mercury">Mercury: Virgo (Uchcha) / Pisces (Neecha)</option>
            <option value="jupiter">Jupiter: Cancer (Uchcha) / Capricorn (Neecha)</option>
            <option value="venus">Venus: Pisces (Uchcha) / Virgo (Neecha)</option>
            <option value="saturn">Saturn: Libra (Uchcha) / Aries (Neecha)</option>
        </select>

        <button onclick="analyzeDignity()">Advanced Scan ⚡</button>

        <div id="resultArea" class="result-box">
            <div id="tags"></div>
            <div class="insight-box">
                <b id="resTitle" style="color:var(--gold);"></b>
                <p id="resDesc" style="font-size: 13px; line-height: 1.6; margin-top: 8px;"></p>
                <i id="bhangaNote" style="font-size: 12px; color:var(--accent); display:block; margin-top:10px;"></i>
            </div>
        </div>
    </div>
</div>



<script>
const advDigData = {
    "sun": { u: "Aries", n: "Libra", desc: "Aries mein Surya 'Exalted' hai kyunki ye agni tatva aur leadership ka peak hai. Libra mein 'Debilitated' hai kyunki Raja ko compromise karna nahi bhata.", bh: "Bhanga: Agar Libra mein Venus (lord) kendra mein ho, toh Neecha-Bhanga rajyoga banta hai." },
    "moon": { u: "Taurus", n: "Scorpio", desc: "Taurus mein Moon 'Exalted' hai (stability). Scorpio mein 'Debilitated' (emotional turbulence).", bh: "Bhanga: Agar Scorpio mein Mars (lord) kendra mein ho, toh Moon ki shakti wapas aati hai." },
    "mars": { u: "Capricorn", n: "Cancer", desc: "Capricorn mein Mangal 'Exalted' (disciplined force). Cancer mein 'Debilitated' (misplaced emotion).", bh: "Bhanga: Agar Moon (Cancer lord) kendra mein ho, toh Mangal ka gussa constructive ban jata hai." },
    "mercury": { u: "Virgo", n: "Pisces", desc: "Virgo mein Mercury 'Exalted' (analytical). Pisces mein 'Debilitated' (dreamy/confused).", bh: "Bhanga: Agar Jupiter (Pisces lord) kendra mein ho, toh Mercury apni logic wapas pa leta hai." },
    "jupiter": { u: "Cancer", n: "Capricorn", desc: "Cancer mein Guru 'Exalted' (nurturing). Capricorn mein 'Debilitated' (materialistic pressure).", bh: "Bhanga: Agar Saturn (Capricorn lord) kendra mein ho, toh Guru ka gyan practical hota hai." },
    "venus": { u: "Pisces", n: "Virgo", desc: "Pisces mein Venus 'Exalted' (unconditional love). Virgo mein 'Debilitated' (calculative/critical).", bh: "Bhanga: Agar Mercury (Virgo lord) kendra mein ho, toh Venus ka artistic side phir se chamak uthta hai." },
    "saturn": { u: "Libra", n: "Aries", desc: "Libra mein Saturn 'Exalted' (fair judge). Aries mein 'Debilitated' (impulsive/restless).", bh: "Bhanga: Agar Mars (Aries lord) kendra mein ho, toh Saturn ka patience aur discipline mahan banata hai." }
};

function analyzeDignity() {
    const val = document.getElementById("digSelect").value;
    const data = advDigData[val];
    document.getElementById("resultArea").style.display = "block";
    
    document.getElementById("tags").innerHTML = 
        `<span class="dignity-tag uchcha">UCHCHA: ${data.u}</span>
         <span class="dignity-tag neecha">NEECHA: ${data.n}</span>`;
    
    document.getElementById("resTitle").innerText = "Dignity Logic:";
    document.getElementById("resDesc").innerText = data.desc;
    document.getElementById("bhangaNote").innerText = data.bh;
}
</script>
</body>
</html>
