<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astro Academy v8.0 | Vitality Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --gold: #ffd700; --bg: #020617; --card: #1e293b; 
            --text: #f8fafc; --accent: #38bdf8; --power: #22c55e;
        }
        
        body { background: var(--bg); color: var(--text); font-family: 'Poppins', sans-serif; padding: 15px; margin: 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; }
        
        .dash-header { 
            background: linear-gradient(135deg, #334155, #0f172a); padding: 25px; border-radius: 30px; 
            margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); text-align: center;
        }
        .power-meter { 
            height: 8px; width: 100%; background: #000; border-radius: 10px; margin: 15px 0; overflow: hidden;
        }
        #powerFill { height: 100%; width: 0%; background: var(--power); transition: 1s cubic-bezier(0.4, 0, 0.2, 1); }

        .age-card { 
            background: var(--card); border-radius: 35px; padding: 30px; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .input-group { background: #0f172a; padding: 20px; border-radius: 25px; margin-bottom: 20px; }
        label { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }

        select { 
            width: 100%; padding: 16px; border-radius: 18px; background: #1e293b; color: white; 
            border: 1px solid #334151; font-size: 14px; outline: none; margin-top: 10px;
        }

        .btn-analyze { 
            width: 100%; padding: 18px; border-radius: 20px; border: none; font-size: 14px; 
            font-weight: 700; cursor: pointer; background: var(--gold); color: #000; 
            text-transform: uppercase; box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }

        .result-panel { margin-top: 30px; display: none; animation: fadeIn 0.5s ease; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .badge { background: rgba(56, 189, 248, 0.1); color: var(--accent); padding: 5px 12px; border-radius: 10px; font-size: 11px; font-weight: 700; }

        .insight-box { 
            background: rgba(255,255,255,0.03); padding: 20px; border-radius: 25px; 
            border-left: 5px solid var(--gold);
        }
        .insight-box h4 { margin: 0 0 8px 0; color: var(--gold); }
        .insight-box p { margin: 0; font-size: 13.5px; line-height: 1.6; color: #cbd5e1; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <div class="dash-header">
        <b style="font-size: 14px; color: var(--gold);">VITALITY INDEX v8.0</b>
        <div class="power-meter"><div id="powerFill"></div></div>
        <span id="powerLabel" style="font-size: 10px; color: #94a3b8;">Degree defines the Potency of Fate</span>
    </div>

    <div class="age-card">
        <div class="input-group">
            <label>Sign Nature</label>
            <select id="signType">
                <option value="odd">Odd Sign (Aries, Gemini, Leo...)</option>
                <option value="even">Even Sign (Taurus, Cancer, Virgo...)</option>
            </select>
            
            <label style="display:block; margin-top:15px;">Degree Range</label>
            <select id="degreeSelect">
                <option value="0">0° - 6°</option>
                <option value="1">6° - 12°</option>
                <option value="2">12° - 18°</option>
                <option value="3">18° - 24°</option>
                <option value="4">24° - 30°</option>
            </select>
        </div>

        <button class="btn-analyze" onclick="calculateVitality()">Check Power Score 💪</button>

        <div id="result" class="result-panel">
            <div class="stat-row">
                <div class="badge" id="avasthaName">AVASTHA</div>
                <div class="badge" style="background:rgba(34, 197, 94, 0.1); color:var(--power);" id="percentBadge">0% Potential</div>
            </div>
            
            <div class="insight-box">
                <h4 id="resTitle">Analysis</h4>
                <p id="resDesc"></p>
            </div>
            
            <p style="text-align:center; font-size: 10px; color: #64748b; margin-top: 20px;">
                Firebase Status: Entry Logged [March 2026]
            </p>
        </div>
    </div>
</div>



<script>
const logic = {
    "odd": [
        { name: "Bala (Infant)", power: 25, title: "The Budding Seed", desc: "Energy kam hai par potential hai. Ye planet result dene mein waqt lega. 25% power." },
        { name: "Kumara (Youth)", power: 50, title: "The Dynamic Explorer", desc: "Utsah (Excitement) bahut hai. Ye planet 50% result dene mein saksham hai." },
        { name: "Yuva (Adult)", power: 100, title: "The Absolute Sovereign", desc: "Poori taqat! Ye planet chart ka hero hai aur bina kisi ki madad ke kismat badal sakta hai." },
        { name: "Vriddha (Old)", power: 10, title: "The Wise Sage", desc: "Sirf gyaan hai, physical results slow hain. Ise support ki zaroorat hoti hai." },
        { name: "Mrita (Dead)", power: 0, title: "The Sleeping Planet", desc: "Planet poori tarah thak chuka hai. Iske results negligible hote hain unless koi bada yoga ho." }
    ],
    "even": [
        { name: "Mrita (Dead)", power: 0, title: "The Sleeping Planet", desc: "Even sign mein shuruat low energy se hoti hai. Result zero ke barabar hain." },
        { name: "Vriddha (Old)", power: 10, title: "The Wise Sage", desc: "Mental results de sakta hai par physical success mein delay aayega." },
        { name: "Yuva (Adult)", power: 100, title: "The Absolute Sovereign", desc: "Even sign ka peak! Best placement for career and wealth. 100% power." },
        { name: "Kumara (Youth)", power: 50, title: "The Dynamic Explorer", desc: "Achhi energy par focus ki kami. Mehnat se results milenge." },
        { name: "Bala (Infant)", power: 25, title: "The Budding Seed", desc: "Start small. Ye planet dheere dheere mature hoga. 25% energy." }
    ]
};

function calculateVitality() {
    const type = document.getElementById("signType").value;
    const range = document.getElementById("degreeSelect").value;
    const data = logic[type][range];

    document.getElementById("powerFill").style.width = data.power + "%";
    document.getElementById("powerLabel").innerText = "Planetary Potency: " + data.power + "%";
    document.getElementById("avasthaName").innerText = data.name.toUpperCase();
    document.getElementById("percentBadge").innerText = data.power + "% POTENTIAL";
    document.getElementById("resTitle").innerText = data.title;
    document.getElementById("resDesc").innerText = data.desc;
    
    document.getElementById("result").style.display = "block";
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}
</script>
</body>
</html>
