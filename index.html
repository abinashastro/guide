<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astro Academy | Cosmic Insights</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        :root { 
            --gold: #ffd700; --bg: #030508; --card: rgba(17, 24, 39, 0.7); 
            --text: #f3f4f6; --accent: #ffd700; --dim: #94a3b8;
        }
        
        body { 
            background: var(--bg); 
            background-image: radial-gradient(circle at 50% 50%, #111827 0%, #030508 100%);
            color: var(--text); 
            font-family: 'Poppins', sans-serif; 
            margin: 0; padding: 20px; 
            display: flex; flex-direction: column; align-items: center;
        }

        .hero { text-align: center; margin: 60px 0 40px; transition: 0.5s; }
        .hero h1 { font-size: 2.5rem; margin: 0; letter-spacing: -1px; background: linear-gradient(to right, #fff, var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero p { color: var(--dim); font-size: 14px; letter-spacing: 2px; text-transform: uppercase; margin-top: 10px; }

        .feed-container { width: 100%; max-width: 600px; }

        /* Blog Post Card */
        .post-card { 
            background: var(--card); border-radius: 30px; padding: 35px; 
            margin-bottom: 30px; border: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(15px); transition: 0.4s cubic-bezier(0.2, 0, 0.2, 1);
            position: relative; overflow: hidden;
        }
        
        .post-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            opacity: 0.3;
        }

        .post-card:hover { transform: translateY(-10px); border-color: rgba(255, 215, 0, 0.2); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }

        .post-date { font-size: 10px; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px; display: block; }
        .post-title { font-size: 22px; font-weight: 600; margin-bottom: 15px; line-height: 1.3; color: #fff; }
        .post-content { font-size: 15px; color: #cbd5e1; line-height: 1.8; white-space: pre-wrap; }

        /* Loader */
        .loader { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid var(--gold); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 50px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Empty State */
        .empty-msg { text-align: center; color: var(--dim); margin-top: 50px; font-style: italic; }

        footer { margin-top: 100px; font-size: 11px; color: #4b5563; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="hero">
        <p>Est. 2026</p>
        <h1>Astro Academy</h1>
    </div>

    <div class="feed-container" id="blog-feed">
        <div class="loader" id="main-loader"></div>
    </div>

    <footer>&copy; 2026 ASTRO ACADEMY • DIVINE KNOWLEDGE</footer>

<script>
// --- FIREBASE CONFIGURATION ---
const firebaseConfig = {
  apiKey: "AIzaSyC0yF3kviJ6U-rdOMUyAOOQyTgSFoWG6co",
  authDomain: "astro-c7b1e.firebaseapp.com",
  databaseURL: "https://astro-c7b1e-default-rtdb.firebaseio.com",
  projectId: "astro-c7b1e",
  storageBucket: "astro-c7b1e.firebasestorage.app",
  messagingSenderId: "885607895929",
  appId: "1:885607895929:web:8f1bf85f7d8aab1b1d55a8"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// --- FETCH POSTS ---
function fetchPosts() {
    const feed = document.getElementById('blog-feed');
    const loader = document.getElementById('main-loader');

    db.collection("astro_posts").orderBy("timestamp", "desc").onSnapshot((querySnapshot) => {
        loader.style.display = "none";
        feed.innerHTML = "";

        if (querySnapshot.empty) {
            feed.innerHTML = "<p class='empty-msg'>The stars are silent today. Check back soon.</p>";
            return;
        }

        querySnapshot.forEach((doc) => {
            const data = doc.data();
            const date = data.timestamp ? new Date(data.timestamp.seconds * 1000).toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' }) : "Recently";
            
            const postHTML = `
                <article class="post-card">
                    <span class="post-date">${date}</span>
                    <h2 class="post-title">${data.title}</h2>
                    <div class="post-content">${data.content}</div>
                </article>
            `;
            feed.innerHTML += postHTML;
        });
    });
}

// Initialize
fetchPosts();
</script>
</body>
</html>
