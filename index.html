<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astro Academy | Cosmic Insights</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        :root { 
            --gold: #ffd700; 
            --bg: #030508; 
            --card-bg: rgba(13, 17, 23, 0.85);
            --text-main: #e2e8f0; /* Softer white for eyes */
            --text-dim: #94a3b8;
        }
        
        body { 
            background: var(--bg); 
            background-image: radial-gradient(circle at top, #1a1f2e 0%, #030508 60%);
            background-attachment: fixed;
            color: var(--text-main); 
            font-family: 'Inter', sans-serif; 
            margin: 0; padding: 20px;
        }

        .hero { text-align: center; padding: 60px 0 30px; }
        .hero h1 { 
            font-family: 'Poppins', sans-serif; font-size: 2.8rem; margin: 0; 
            font-weight: 700; letter-spacing: -1.5px;
            color: #fff; text-shadow: 0 0 20px rgba(255,255,255,0.1);
        }

        .feed-container { width: 100%; max-width: 650px; margin: 0 auto; }

        .post-card { 
            background: var(--card-bg); 
            border-radius: 28px; padding: 35px; 
            margin-bottom: 35px; 
            border: 1px solid rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(25px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            transition: 0.4s ease;
        }

        .post-date { 
            font-size: 11px; color: var(--gold); font-weight: 600;
            letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px; display: block;
        }

        .post-title { 
            font-family: 'Poppins', sans-serif; font-size: 24px; font-weight: 700; 
            margin-bottom: 25px; color: #fff; line-height: 1.3;
        }

        /* --- KEY UPDATE: JUSTIFIED CONTENT --- */
        .post-content { 
            font-size: 16px; 
            color: #cbd5e1; 
            white-space: pre-wrap;
            line-height: 1.8; /* High readability spacing */
            text-align: justify; /* Proper alignment */
            text-justify: inter-word; /* Smooth justification for web */
            word-spacing: 1px;
        }

        /* Special styling for list items (asterisks) */
        .post-content::first-line { font-weight: 400; }

        .loader { border: 3px solid rgba(255,255,255,0.05); border-top: 3px solid var(--gold); border-radius: 50%; width: 35px; height: 35px; animation: spin 1s linear infinite; margin: 50px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        footer { text-align: center; padding: 50px; font-size: 10px; color: #4b5563; letter-spacing: 3px; }

        @media (max-width: 500px) {
            .post-card { padding: 25px 20px; border-radius: 20px; }
            .post-title { font-size: 20px; }
            .post-content { font-size: 15px; text-align: left; /* Mobile par Left align zyada saaf lagta hai agar screen choti ho */ }
        }
    </style>
</head>
<body>

    <div class="hero">
        <h1>Astro Academy</h1>
    </div>

    <div class="feed-container" id="blog-feed">
        <div class="loader" id="main-loader"></div>
    </div>

    <footer>&copy; 2026 ASTRO ACADEMY</footer>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC0yF3kviJ6U-rdOMUyAOOQyTgSFoWG6co",
  authDomain: "astro-c7b1e.firebaseapp.com",
  projectId: "astro-c7b1e",
  storageBucket: "astro-c7b1e.firebasestorage.app",
  messagingSenderId: "885607895929",
  appId: "1:885607895929:web:8f1bf85f7d8aab1b1d55a8"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function fetchPosts() {
    const feed = document.getElementById('blog-feed');
    const loader = document.getElementById('main-loader');

    db.collection("astro_posts").orderBy("timestamp", "desc").onSnapshot((snap) => {
        loader.style.display = "none";
        feed.innerHTML = "";
        snap.forEach((doc) => {
            const data = doc.data();
            const isFeatured = data.featured || false;
            const date = data.timestamp ? new Date(data.timestamp.seconds * 1000).toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' }) : "Recently";
            
            feed.innerHTML += `
                <article class="post-card" style="${isFeatured ? 'border-color: var(--gold);' : ''}">
                    <span class="post-date">${date} ${isFeatured ? '• FEATURED' : ''}</span>
                    <h2 class="post-title">${data.title}</h2>
                    <div class="post-content">${data.content}</div>
                </article>
            `;
        });
    });
}

fetchPosts();
</script>
</body>
</html>
