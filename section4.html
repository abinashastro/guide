<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astro Academy v5.2 | Bhava Logic</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --gold: #ffd700; --bg: #030712; --card: #111827; 
            --text: #f3f4f6; --accent: #00ffcc; --malefic: #ef4444; --benefic: #10b981;
        }
        
        body { background: var(--bg); color: var(--text); font-family: 'Poppins', sans-serif; padding: 15px; margin: 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; }
        
        /* Classification Header */
        .class-header { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 15px; scrollbar-width: none; }
        .tag { white-space: nowrap; padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; border: 1px solid rgba(255,255,255,0.1); }
        .tag.kendra { background: rgba(0, 255, 204, 0.1); color: var(--accent); }
        .tag.trikona { background: rgba(255, 215, 0, 0.1); color: var(--gold); }
        .tag.dusthana { background: rgba(239, 68, 68, 0.1); color: var(--malefic); }

        .main-card { 
            background: var(--card); border-radius: 30px; padding: 25px; 
            border: 1px solid rgba(255,215,0,0.1); box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .input-group { margin-bottom: 20px; }
        label { font-size: 12px; color: #9ca3af; margin-left: 5px; display: block; margin-bottom: 8px; }

        select { 
            width: 100%; padding: 18px; border-radius: 20px; background: #1f2937; color: white; 
            border: 1px solid #374151; font-size: 15px; outline: none; cursor: pointer;
        }

        .btn-decode { 
            width: 100%; padding: 18px; border-radius: 20px; border: none; font-size: 14px; 
            font-weight: 700; cursor: pointer; background: var(--gold); color: #000; 
            text-transform: uppercase; margin-top: 10px; transition: 0.3s;
        }
        .btn-decode:hover { opacity: 0.9; transform: scale(0.98); }

        /* Logic Display */
        .logic-panel { margin-top: 25px; display: none; animation: slideUp 0.5s ease; }
        .stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .stat-card { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 20px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .stat-card small { font-size: 10px; color: #9ca3af; display: block; margin-bottom: 4px; }
        .stat-card b { font-size: 13px; color: var(--gold); }

        .deep-logic { 
            background: #1e293b; padding: 20px; border-radius: 22px; 
            border-left: 5px solid var(--accent);
        }
        .deep-logic h4 { margin: 0 0 10px 0; font-size: 16px; color: var(--accent); }
        .deep-logic p { margin: 0; font-size: 13.5px; line-height: 1.6; color: #d1d5db; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <div class="class-header">
        <div class="tag kendra">Kendra (1,4,7,10)</div>
        <div class="tag trikona">Trikona (1,5,9)</div>
        <div class="tag">Upachaya (3,6,10,11)</div>
        <div class="tag dusthana">Dusthana (6,8,12)</div>
    </div>

    <div class="main-card">
        <h2 style="margin:0; color:var(--gold);">House Intelligence</h2>
        <p style="font-size: 12px; color:#9ca3af; margin-bottom: 25px;">Decoding the mechanical logic of 12 Bhavas.</p>

        <div class="input-group">
            <label>Select House to Decode</label>
            <select id="houseSelect" onchange="resetView()">
                <option value="1">1st House - Identity & Physicality</option>
                <option value="2">2nd House - Wealth & Speech</option>
                <option value="3">3rd House - Courage & Efforts</option>
                <option value="4">4th House - Happiness & Mother</option>
                <option value="5">5th House - Creativity & Intelligence</option>
                <option value="6">6th House - Debt, Disease & Enemies</option>
                <option value="7">7th House - Partnership & Marriage</option>
                <option value="8">8th House - Longevity & Secrets</option>
                <option value="9">9th House - Luck & Dharma</option>
                <option value="10">10th House - Career & Status</option>
                <option value="11">11th House - Gains & Ambitions</option>
                <option value="12">12th House - Loss & Spirituality</option>
            </select>
        </div>

        <button class="btn-decode" onclick="decodeHouse()">Explore Deep Logic 🔍</button>

        <div id="logicArea" class="logic-panel">
            <div class="stat-row">
                <div class="stat-card"><small>Classification</small><b id="classText">---</b></div>
                <div class="stat-card"><small>Karaka (Significator)</small><b id="karakaText">---</b></div>
            </div>
            <div class="deep-logic">
                <h4 id="titleText">House Secret</h4>
                <p id="descText"></p>
            </div>
            
            <button class="btn-decode" style="background: var(--accent); margin-top: 20px;" onclick="finalize()">
                Save to Profile & Finish 🏆
            </button>
        </div>
    </div>
</div>



<script>
const advancedData = {
    "1": { cl: "Kendra & Trikona", ka: "Sun (Surya)", title: "The Seed of Life", desc: "Ye 'Tanubhav' hai. Iske bina baki 11 ghar be-maayani hain. Ye aapki physical strength aur 'Self-Will' ko represent karta hai." },
    "2": { cl: "Dhana Sthana", ka: "Jupiter (Guru)", title: "Resources & Lineage", desc: "Sirf paisa nahi, ye 'Sanskar' aur 'Family Roots' ka ghar hai. Ye batata hai ki aapko virasat mein kya mila hai." },
    "3": { cl: "Upachaya (Growth)", ka: "Mars (Mangal)", title: "The Power of Will", desc: "Communication aur chote bhai-behen ka ghar. Ye batata hai ki aap apni kismat badalne ke liye kitni mehnat karenge." },
    "4": { cl: "Kendra (Pillar)", ka: "Moon (Chandra)", title: "Inner Peace", desc: "Ye 'Sukh Sthana' hai. Aapke ghar ki shanti, maa ka pyar aur mental stability isi ghar se dekhi jati hai." },
    "5": { cl: "Trikona (Fortune)", ka: "Jupiter", title: "Creative Intelligence", desc: "9th house (Bhagya) ka 9th ghar. Ye aapke purva punya (past life credit) aur aapki intelligence ka balance hai." },
    "6": { cl: "Dusthana / Upachaya", ka: "Mars / Saturn", title: "The Daily Battle", desc: "Ye service ka ghar hai. Mushkilein (Enemies/Debt) aayengi par ye ghar unhe jeetne ki shakti bhi deta hai." },
    "7": { cl: "Kendra (Pillar)", ka: "Venus (Shukra)", title: "The Mirror", desc: "Aapke opposite jo hai—Life Partner ya Business Partner. Ye 'Social Image' aur public interaction ka point hai." },
    "8": { cl: "Dusthana (Moksha)", ka: "Saturn", title: "Transformation", desc: "Death aur Rebirth ka ghar. Ye sudden events aur chhupe hue gyaan (occult) ka raaz rakhta hai." },
    "9": { cl: "Highest Trikona", ka: "Jupiter / Sun", title: "Divine Grace", desc: "Sabse shubh ghar. Ye aapka Dharma, Guru aur pita ka gyaan hai. Ye batata hai ki kismat kab saath degi." },
    "10": { cl: "Kendra / Upachaya", ka: "Sun / Mercury", title: "Social Identity", desc: "Aapka career aur karma. Duniya aapko kis naam se jaanti hai, wo isi unchai (Mid-heaven) se tay hota hai." },
    "11": { cl: "Upachaya (Gains)", ka: "Jupiter", title: "Fulfilment of Desires", desc: "Har tarah ka profit—paisa ho ya social circle. 6th (Struggle) se 6th hone ki wajah se ye victory ke baad ka 'Gain' hai." },
    "12": { cl: "Dusthana / Moksha", ka: "Saturn / Ketu", title: "Final Liberation", desc: "Kharcha, videsh yatra aur moksha. Ye 'Self' ke khatm hone aur universe se judne ka point hai." }
};

function decodeHouse() {
    const val = document.getElementById("houseSelect").value;
    const data = advancedData[val];
    
    document.getElementById("classText").innerText = data.cl;
    document.getElementById("karakaText").innerText = data.ka;
    document.getElementById("titleText").innerText = data.title;
    document.getElementById("descText").innerText = data.desc;
    
    document.getElementById("logicArea").style.display = "block";
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

function resetView() {
    document.getElementById("logicArea").style.display = "none";
}

function finalize() {
    console.log("Firebase Sync: Full 12 Bhava Architecture Stored [2026-03-08]");
    alert("Full Architecture Synced! Aapne 12 Bhavon ka gyaan prapt kar liya hai. Ab aap Kundli analysis ke liye puri tarah taiyar hain.");
}
</script>
</body>
</html>
