<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astro Academy | Master Admin 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        :root { 
            --gold: #ffd700; --bg: #05070a; --card: #111827; 
            --text: #f3f4f6; --accent: #ffd700; --active: #00ffcc; --danger: #f87171;
            --ai-glow: #8b5cf6; --edit: #60a5fa;
        }
        
        body { background: var(--bg); color: var(--text); font-family: 'Poppins', sans-serif; padding: 15px; margin: 0; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 480px; }
        
        #auth-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; }
        
        .status-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 11px; letter-spacing: 1px; color: #94a3b8; }
        .dot { height: 6px; width: 6px; background: var(--active); border-radius: 50%; display: inline-block; box-shadow: 0 0 8px var(--active); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .glass-card { 
            background: var(--card); border-radius: 35px; padding: 30px; 
            box-shadow: 20px 20px 60px #000, -5px -5px 20px rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.08); position: relative;
        }

        .ai-status { font-size: 9px; color: var(--ai-glow); margin-bottom: 15px; display: flex; align-items: center; gap: 5px; text-transform: uppercase; font-weight: 600; }
        
        input, textarea { 
            width: 100%; padding: 18px; border-radius: 20px; background: #0a0c14; color: white; 
            border: 1px solid rgba(255,255,255,0.05); font-size: 15px; outline: none; box-sizing: border-box;
            box-shadow: inset 4px 4px 10px #000; margin-bottom: 20px;
        }
        
        input:focus, textarea:focus { border-color: var(--accent); }
        textarea { height: 180px; line-height: 1.6; }

        .btn-master { 
            width: 100%; padding: 20px; border-radius: 22px; border: none; font-size: 13px; 
            font-weight: 800; cursor: pointer; text-transform: uppercase; letter-spacing: 2px;
            background: linear-gradient(145deg, var(--accent), #b8860b);
            color: #000; transition: 0.2s;
        }
        
        .btn-update { background: linear-gradient(145deg, #3b82f6, #1d4ed8); color: white; }

        #toast { 
            position: fixed; top: 20px; background: var(--active); color: #000; 
            padding: 10px 25px; border-radius: 50px; font-size: 12px; font-weight: 600; 
            display: none; z-index: 1000;
        }

        .post-card { 
            background: rgba(17, 24, 39, 0.6); padding: 18px; border-radius: 22px; margin-bottom: 12px;
            border: 1px solid rgba(255,255,255,0.03); display: flex; justify-content: space-between; align-items: center;
        }
        .action-btn { background: none; border: none; cursor: pointer; font-size: 18px; padding: 5px; }
    </style>
</head>
<body>

<div id="toast">ACTION SUCCESSFUL ✨</div>

<div class="container" id="auth-screen">
    <div class="glass-card" style="width: 100%; text-align: center;">
        <h2 style="color: var(--gold); margin-bottom: 10px;">Adept Access</h2>
        <input type="password" id="masterKey" placeholder="KEY: 2026" style="text-align: center;">
        <button class="btn-master" onclick="checkAuth()">Login</button>
    </div>
</div>

<div class="container" id="main-dashboard" style="display: none;">
    <div class="status-header">
        <span><div class="dot"></div> SESSION: LIVE</span>
        <span id="date-display" style="color: var(--gold)">MARCH 2026</span>
    </div>

    <div class="glass-card">
        <div class="ai-status">✨ AI Energy: <span id="tone-val" style="color: white;">Waiting...</span></div>
        <input type="text" id="postTitle" placeholder="Title...">
        <textarea id="postContent" placeholder="Message..." oninput="analyzeTone()"></textarea>
        <button class="btn-master" id="publishBtn" onclick="handleSubmission()">Transmit Post</button>
        <p id="edit-indicator" style="font-size: 10px; color: var(--edit); text-align: center; margin-top: 10px; display: none;">EDITING MODE ACTIVE</p>
    </div>

    <p style="font-size: 10px; color: #4b5563; text-transform: uppercase; margin: 30px 0 15px; letter-spacing: 2px;">Broadcast History</p>
    <div id="liveFeed"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC0yF3kviJ6U-rdOMUyAOOQyTgSFoWG6co",
  authDomain: "astro-c7b1e.firebaseapp.com",
  projectId: "astro-c7b1e",
  storageBucket: "astro-c7b1e.firebasestorage.app",
  messagingSenderId: "885607895929",
  appId: "1:885607895929:web:8f1bf85f7d8aab1b1d55a8"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
let currentEditId = null;

function checkAuth() {
    if(document.getElementById('masterKey').value === "2026") {
        document.getElementById('auth-screen').style.display = "none";
        document.getElementById('main-dashboard').style.display = "block";
        startFeed();
    } else { alert("Wrong Key"); }
}

function analyzeTone() {
    const text = document.getElementById('postContent').value.toLowerCase();
    const toneElement = document.getElementById('tone-val');
    if (text.includes('warning')) { toneElement.innerText = "Cautionary ⚠️"; toneElement.style.color = "#f87171"; }
    else if (text.includes('love')) { toneElement.innerText = "High Vibration ✨"; toneElement.style.color = "#00ffcc"; }
    else { toneElement.innerText = "Neutral ⚖️"; toneElement.style.color = "white"; }
}

// --- NEW ROBUST EDIT LOGIC ---
function triggerEdit(btn) {
    currentEditId = btn.getAttribute('data-id');
    const title = btn.getAttribute('data-title');
    const content = btn.getAttribute('data-content');

    document.getElementById('postTitle').value = title;
    document.getElementById('postContent').value = content;
    
    const pBtn = document.getElementById('publishBtn');
    pBtn.innerText = "Update Record";
    pBtn.classList.add('btn-update');
    document.getElementById('edit-indicator').style.display = "block";
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
    analyzeTone();
}

async function handleSubmission() {
    const title = document.getElementById('postTitle').value;
    const content = document.getElementById('postContent').value;
    if(!title || !content) return;

    try {
        if(currentEditId) {
            await db.collection("astro_posts").doc(currentEditId).update({ title, content });
            showToast("UPDATED ✨");
        } else {
            await db.collection("astro_posts").add({ title, content, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
            showToast("PUBLISHED ✨");
        }
        resetForm();
    } catch (e) { alert(e.message); }
}

function resetForm() {
    currentEditId = null;
    document.getElementById('postTitle').value = "";
    document.getElementById('postContent').value = "";
    const pBtn = document.getElementById('publishBtn');
    pBtn.innerText = "Transmit Post";
    pBtn.classList.remove('btn-update');
    document.getElementById('edit-indicator').style.display = "none";
}

function startFeed() {
    db.collection("astro_posts").orderBy("timestamp", "desc").onSnapshot((snap) => {
        const feed = document.getElementById('liveFeed');
        feed.innerHTML = "";
        snap.forEach(doc => {
            const p = doc.data();
            const card = document.createElement('div');
            card.className = 'post-card';
            card.innerHTML = `
                <div>
                    <div style="font-size: 13px; font-weight: 600;">${p.title}</div>
                    <div style="font-size: 9px; color: #4b5563;">VIBE RECORDED</div>
                </div>
                <div>
                    <button class="action-btn edit-trigger" 
                        data-id="${doc.id}" 
                        data-title="${p.title.replace(/"/g, '&quot;')}" 
                        data-content="${p.content.replace(/"/g, '&quot;')}"
                        style="color:var(--edit)">✎</button>
                    <button class="action-btn" style="color:var(--danger)" onclick="deletePost('${doc.id}')">×</button>
                </div>
            `;
            feed.appendChild(card);
        });

        // Event listener fix
        document.querySelectorAll('.edit-trigger').forEach(b => {
            b.onclick = function() { triggerEdit(this); };
        });
    });
}

async function deletePost(id) {
    if(confirm("Delete?")) await db.collection("astro_posts").doc(id).delete();
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg; t.style.display = "block";
    setTimeout(() => t.style.display = "none", 3000);
}
</script>
</body>
</html>
